name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  ts-build:
    name: ts server build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tools/package-lock.json

      - run: npm ci

      - run: npm run build

      # UE5-free mapper tests. Full `npm test` needs a UE5 install on a
      # self-hosted runner — deferred to a later sprint.
      - run: npm run test:unit
